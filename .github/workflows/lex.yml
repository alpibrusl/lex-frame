name: Lex CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lex
        run: curl -sSf https://install.lex-lang.dev | sh -s -- --version v0.9.1

      - name: Add Lex to PATH
        run: echo "$HOME/.lex/bin" >> $GITHUB_PATH

      - name: Run Lex CI
        run: lex ci
